name: Cleanup old Rujnah release assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'cleanup-release-assets'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old assets from Rujnah release
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set([
              'Rujnah-0.8.1-Setup.exe',
              'Rujnah-0.8.1-Setup.exe.sha256.txt',
              'Rujnah-0.8.0-Setup.exe',
              'Rujnah-0.8.0-Setup.exe.sha256.txt',
              'Rujnah-0.7.3-beta14-macOS-arm64.dmg',
              'Rujnah-0.7.3-beta14-macOS-arm64.dmg.sha256.txt',
              'Rujnah-0.7.3-beta14-macOS-x86_64.dmg',
              'Rujnah-0.7.3-beta14-macOS-x86_64.dmg.sha256.txt'
            ]);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'Rujnah'
            });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100
              }
            );

            const oldAssets = assets.filter(asset => !keep.has(asset.name));

            core.info(`Keeping ${assets.length - oldAssets.length} assets and deleting ${oldAssets.length} old assets`);

            for (const asset of oldAssets) {
              core.info(`Deleting ${asset.name} (${asset.id})`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }
